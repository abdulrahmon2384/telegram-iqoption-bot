<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Subtle grid pattern -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer Neon Pulse Ring -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="none" stroke="url(#glow-grad)" stroke-width="6" opacity="0.85" filter="url(#glow)"/>

  <!-- Central Bot / Signal Icon Graphic -->
  <!-- Bot Head Base -->
  <rect x="136" y="156" width="240" height="190" rx="36" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="8"/>

  <!-- Antenna -->
  <line x1="256" y1="156" x2="256" y2="106" stroke="url(#accent-grad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="18" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="96" r="10" fill="#ffffff"/>

  <!-- Bot Ears / Signals -->
  <rect x="110" y="216" width="26" height="70" rx="10" fill="#10b981" opacity="0.9"/>
  <rect x="376" y="216" width="26" height="70" rx="10" fill="#38bdf8" opacity="0.9"/>

  <!-- Bot Eyes / Screens -->
  <rect x="176" y="206" width="60" height="42" rx="14" fill="#10b981" filter="url(#glow)"/>
  <rect x="276" y="206" width="60" height="42" rx="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="206" cy="227" r="10" fill="#ffffff"/>
  <circle cx="306" cy="227" r="10" fill="#ffffff"/>

  <!-- Upward Trendline in Bot Screen / Mouth -->
  <path d="M 176 300 L 216 285 L 256 295 L 296 270 L 336 250" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="330,240 346,245 342,260" fill="#10b981"/>

  <!-- Bottom Badges / Pulse Dots -->
  <circle cx="216" cy="386" r="12" fill="#10b981" opacity="0.8"/>
  <circle cx="256" cy="386" r="12" fill="#38bdf8" opacity="0.8"/>
  <circle cx="296" cy="386" r="12" fill="#6366f1" opacity="0.8"/>
</svg>
